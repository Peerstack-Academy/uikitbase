<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHow - Home 1</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="./assets/logo.png" class="logo">

            <div class="navbar">
                <button class="navbutton has-dropdown">Home</button>
                <div class="dropdown">
                    <a href="#">Home 1</a>
                    <a href="#">Home 2</a>
                    <a href="#">Home 3</a>
                </div>
                <button class="navbutton">Pages</button>
                <button class="navbutton">FAQ</button>
                <button class="navbutton">Content</button>
                <button class="navbutton">Elements</button>

            </div>
            <div class="auth-buttons">
                <button class="auth-btn">REGISTER</button>
                <button class="auth-btn">LOGIN</button>

            </div>
            <div class="welcome">
                <h1 style="color:white; font-size:45px;">Welcome to The Knowledge Base</h1>
                <h4 style="color:rgba(255, 255, 255, 0.385); font-size:25px; margin-top:1%;">How can we help you?</h4>

                <input class="search" type="text" placeholder="Enter search term here">
            </div>

        </div>
        <div class="content">

        </div>

        <div class="footer">
            <p class="footertext">Sonya Jordan,Ap #443-336 Ullamcorper. Street, Visalia VA 54886</p>
            <p class="footertext">info@domain.tld</p>
            <div class="social">
                <img style="height:32px;opacity:0.5;" src="./assets/instagram.svg">
                <img style="height:32px;opacity:0.5" src="./assets/youtube.svg">
                <img style="height:32px;opacity:0.5;" src="./assets/instagram.svg">
                <img style="height:32px;opacity:0.5" src="./assets/youtube.svg">
                <img style="height:32px;opacity:0.5;" src="./assets/instagram.svg">
                <img style="height:32px;opacity:0.5" src="./assets/youtube.svg">
            </div>
            <div class="footernav">

                <button class="navbutton" style="color: rgba(13, 6, 6, 0.505);font-weight:400;">HOMEPAGE</button>
                <hr style="color:gray; border-style:solid; border-color:gray;">
                <button class="navbutton" style="color: rgba(13, 6, 6, 0.505);font-weight:400;">FAQ</button>
                <hr style="color:gray; border-style:solid; border-color:gray; height:20px">
                <button class="navbutton" style="color: rgba(13, 6, 6, 0.505);font-weight:400;">CONTACT</button>

            </div>
        </div>

    </div>

</body>
<script src="script.js"> </script>

</html>
