<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="styles.css" />

        <!-- fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header class="container-to-shrink">
            <nav>
                <a href="/" class="logo">
                    <img src="./logo.png" alt="logo of company" />
                </a>

                <ul class="nav-elements">
                    <li class="nav-list">
                        <a href="#home" class="nav-el">HOME</a>
                    </li>
                    <li class="nav-list">
                        <a href="#pages" class="nav-el">PAGES</a>
                    </li>
                    <li class="nav-list">
                        <a href="#faq" class="nav-el">FAQ</a>
                    </li>
                    <li class="nav-list">
                        <a href="#contact" class="nav-el">CONTACT</a>
                    </li>
                    <li class="nav-list">
                        <a href="#elements" class="nav-el">ELEMENTS</a>
                    </li>
                </ul>
                <div class="buttons-of-nav">
                    <button class="nav-button">REGISTER</button>
                    <button class="nav-button">LOGIN</button>
                </div>
            </nav>

            <div class="first-section">
                <div class="welcome-text-section">
                    <h1>Welcome to The Knowledge Base</h1>
                    <p>How can we help you?</p>
                </div>

                <div class="search-section">
                    <input type="text" placeholder="Enter search term here" />
                    <img
                        src="./search-interface-symbol (1).png"
                        alt="Search icon"
                        class="search-icon"
                    />
                </div>
            </div>
        </header>

        <script src="script.js"></script>
    </body>
</html>
